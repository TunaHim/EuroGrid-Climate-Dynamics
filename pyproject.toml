[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eurogrid"
version = "0.0.1"
description = "Euro-Atlantic blocking, wind-drought and ramp diagnostics: ERA5 + SMARD baseline, EERIE coupled-model evaluation."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "xarray>=2024.6",
  "dask[array]>=2024.6",
  "zarr>=2.18,<3",
  "fsspec>=2024.6",
  "gcsfs>=2024.6",
  "matplotlib>=3.8",
  "aiohttp>=3.9",
  "polars>=1.0",
  "pyarrow>=15",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-socket>=0.7", "ruff>=0.5", "jupyterlab>=4"]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]
