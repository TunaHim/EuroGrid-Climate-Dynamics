name: eurogrid
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  # open_group(zarr_format=...) in xarray>=2025.10 breaks with zarr<3; unpin together
  - xarray>=2024.6,<2025.10
  - dask
  - zarr<3
  - fsspec
  - gcsfs
  - aiohttp
  - polars
  - pyarrow
  - pyyaml
  - requests
  - matplotlib
  - cartopy
  - pytest
  - pytest-socket
  - ruff
  - pip
  - pip:
      - -e .
