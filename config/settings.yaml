# Project-wide settings. Values under `verified` were read from the live
# stores on 2026-09-21; treat anything else as a planning assumption.

domain:                   # Euro-Atlantic analysis box, degrees
  lat_min: 30.0
  lat_max: 75.0
  lon_min: -40.0
  lon_max: 40.0

periods:
  smoke_test: ["2023-01-01", "2023-01-31"]      # pipeline check only, not statistics
  dark_lull_validation: ["2024-11-01", "2024-12-31"]
  eerie_hist_eval: ["1980-12-01", "2010-02-28"]  # DJF only
  eerie_future: ["2041-01-01", "2045-12-31"]     # gated on hist evaluation; verify coverage

smard:
  base_url: "https://www.smard.de/app/chart_data"
  zones: ["50Hertz", "TenneT", "Amprion", "TransnetBW"]
  offshore_zones: ["50Hertz", "TenneT"]           # others must be exactly zero
  cache_dir: "data/smard"

era5:
  # verified 2026-09-21: one ARCO store carries 100 m winds, sp and 37-level geopotential;
  # hourly, chunks = 1 timestep x globe (3-D: x 37 levels), valid_time_stop 2026-06-30.
  store: "gs://gcp-public-data-arco-era5/ar/full_37-1h-0p25deg-chunk-1.zarr-v3"
  single_level_vars: ["100m_u_component_of_wind", "100m_v_component_of_wind", "surface_pressure"]
  pressure_level_vars: ["geopotential"]
  z500_level_hpa: 500
  z500_stride_hours: 6      # each Z500 hour costs a full 37-level global chunk; TM1990 is daily
  cache_dir: "data/era5"

eerie:
  base_url: "https://km-scale-cloud.dkrz.de/datasets"
  store_suffix: "zarr"                             # bare dataset URL returns 404
  zarr_format: 2
  datasets:
    hist_3d: "ifs-fesom2-sr.hist-1950.v20240304.atmos.gr025.3D_6hourly"
    hist_2d: "ifs-fesom2-sr.hist-1950.v20240304.atmos.gr025.2D_6hourly_instant"
    ssp245_3d: "ifs-fesom2-sr.highres-future-ssp245.v20240304.atmos.gr025.3D_6hourly"
    ssp245_2d: "ifs-fesom2-sr.highres-future-ssp245.v20240304.atmos.gr025.2D_6hourly_instant"
  hub_height_proxy_level_hpa: 1000
  hub_height_bracket_level_hpa: 925
  z500_level_hpa: 500
  max_concurrency: 4                               # rate limits unpublished; be defensive
  retries: 6
  cache_dir: "data/eerie"
  verified:
    cadence_hours: 6
    flat_dim: "value"
    flat_length: 1038240                           # 1440 x 721, C-order (lat, lon)
    lat_order: "90 -> -90"
    lon_order: "0 -> 179.75 then -180 -> -0.25"    # not monotonic; roll required
    stored_chunks_3d: [3, 3, 1038240]              # [time, level, space]
    levels_hpa: [1, 5, 10, 20, 30, 50, 70, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
    has_100m_wind: false

blocking:                 # Tibaldi & Molteni (1990)
  domain:                  # extra northern margin needed for the 80°N TM band
    lat_min: 30.0
    lat_max: 85.0
    lon_min: -40.0
    lon_max: 40.0
  phi0_deg: 60.0
  arm_deg: 20.0
  scan_offsets_deg: [-4.0, 0.0, 4.0]
  ghgn_threshold_m_per_deg: -10.0
  min_persistence_days: 5
  min_sector_width_deg: 20.0
  benchmark_windows:
    - {label: "2020-21", start: "2020-12-01T00:00:00", end: "2021-03-01T00:00:00"}
    - {label: "2021-22", start: "2021-12-01T00:00:00", end: "2022-03-01T00:00:00"}
    - {label: "2022-23", start: "2022-12-01T00:00:00", end: "2023-03-01T00:00:00"}
    - {label: "2023-24", start: "2023-12-01T00:00:00", end: "2024-03-01T00:00:00"}
    - {label: "2024-25", start: "2024-12-01T00:00:00", end: "2025-03-01T00:00:00"}

dunkelflaute:
  capacity_factor_thresholds: [0.05, 0.10, 0.15, 0.20]   # swept, not fixed
  min_duration_hours: [24, 48, 72]

ramps:
  windows_hours: [1, 3]
  aliasing_subsample_hours: 6
